name: Windows release packages
on:
  workflow_dispatch:
    inputs:
      unsigned_preview:
        description: 'Explicitly build an unsigned preview (no verified publisher)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    env:
      OPENCLAUDE_SIGN_CERT_SHA1: ${{ vars.OPENCLAUDE_SIGN_CERT_SHA1 }}
      OPENCLAUDE_SIGNTOOL: ${{ vars.OPENCLAUDE_SIGNTOOL }}
      OPENCLAUDE_SIGN_DLIB: ${{ vars.OPENCLAUDE_SIGN_DLIB }}
      OPENCLAUDE_SIGN_METADATA: ${{ vars.OPENCLAUDE_SIGN_METADATA }}
      OPENCLAUDE_UPDATE_PRIVATE_KEY: ${{ secrets.OPENCLAUDE_UPDATE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Install Rust
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - name: Select Rust
        run: rustup default 1.97.1
      - run: npm ci
      - name: Build installer and portable ZIP
        shell: pwsh
        run: |
          if ('${{ inputs.unsigned_preview }}' -eq 'true') {
            npm run release:package -- --unsigned
          } else {
            npm run release:package
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Horizon-windows-x64
          path: |
            release/*-setup.exe
            release/*-portable.zip
            release/SHA256SUMS.txt
            release/update.json
          if-no-files-found: error
