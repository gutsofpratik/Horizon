name: Windows release packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Install Rust
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - name: Select Rust
        run: rustup default 1.97.1
      - run: npm ci
      - name: Build installer and portable ZIP
        run: npm run release:package
      - uses: actions/upload-artifact@v4
        with:
          name: OpenClaude-windows-x64
          path: |
            release/*-setup.exe
            release/*-portable.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
