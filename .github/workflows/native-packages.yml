name: Horizon native packages
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        default: all
        options: [all, windows, macos, linux]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'linux' && '["ubuntu-24.04"]' || inputs.platform == 'macos' && '["macos-14"]' || inputs.platform == 'windows' && '["windows-latest"]' || '["windows-latest","macos-14","ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-engine-sources.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vendor/AionCore -> ../../.local/engine-target
            src-tauri -> target
          cache-on-failure: true
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libxkbcommon-dev libxcb-randr0-dev libpipewire-0.3-dev libdbus-1-dev libgbm-dev
      - name: Verify Ubuntu graphics libraries before linking
        if: runner.os == 'Linux'
        run: pkg-config --exists gbm xkbcommon xcb-randr libpipewire-0.3 && pkg-config --modversion gbm
      - run: npm run lint
      - run: npm run typecheck
      - name: Prepare pinned standalone Python
        run: node scripts/release/prepare-python.mjs
      - run: npm run package:native
      - name: Verify platform packages
        run: node scripts/release/verify-native-packages.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Horizon-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*.zip
            release/*.sha256
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
