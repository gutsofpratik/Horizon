name: Publish signed update metadata
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag
        required: true
permissions:
  contents: write
jobs:
  metadata:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download the published Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("Stable published release required") else true end'
          mkdir -p update-assets
          gh release download "$RELEASE_TAG" --pattern "Horizon-${RELEASE_TAG#v}-windows-x64-setup.exe" --dir update-assets
      - name: Sign release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          OPENCLAUDE_UPDATE_PRIVATE_KEY: ${{ secrets.OPENCLAUDE_UPDATE_PRIVATE_KEY }}
        run: |
          node --input-type=module -e "import {writeUpdateManifest} from './scripts/release/update-manifest.mjs'; await writeUpdateManifest('update-assets',process.env.RELEASE_TAG.slice(1));"
      - name: Attach update metadata to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" update-assets/update.json --clobber
